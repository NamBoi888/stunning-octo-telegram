<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MBTI House — a tiny Sims-like</title>
<style>
  :root {
    --panel-bg: rgba(18, 22, 34, 0.88);
    --panel-border: rgba(255, 255, 255, 0.12);
    --accent: #4be38a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0c0f18; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: #eef1f8; }
  #game { position: fixed; inset: 0; display: block; }

  .hud { position: fixed; z-index: 10; user-select: none; }

  #clock {
    top: 14px; left: 14px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  #clock .time { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  #clock .day { font-size: 12px; opacity: 0.75; }
  #clock button {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--panel-border);
    color: #eef1f8; border-radius: 8px;
    padding: 4px 10px; cursor: pointer; font-size: 13px;
  }
  #clock button.active { background: var(--accent); color: #08130c; font-weight: 700; }

  #roster {
    top: 14px; right: 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  #roster .chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 5px 12px 5px 6px;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  #roster .chip:hover { transform: translateX(-3px); }
  #roster .chip.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  #roster .chip .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  #roster .chip .nm { font-size: 13px; font-weight: 600; }
  #roster .chip .ty { font-size: 10px; opacity: 0.65; margin-left: 2px; }
  #roster .chip .mood { margin-left: auto; font-size: 13px; }

  #panel {
    left: 50%; bottom: 14px; transform: translateX(-50%);
    width: min(680px, calc(100vw - 28px));
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 12px 16px;
    display: none;
    gap: 16px;
    align-items: center;
  }
  #panel.open { display: flex; }
  #panel .portrait {
    width: 58px; height: 58px; border-radius: 50%;
    flex: none; display: flex; align-items: center; justify-content: center;
    font-size: 26px; border: 3px solid rgba(255,255,255,0.25);
  }
  #panel .who .name { font-size: 17px; font-weight: 700; }
  #panel .who .mbti { font-size: 11px; color: var(--accent); font-weight: 700; letter-spacing: 1px; }
  #panel .who .doing { font-size: 12px; opacity: 0.8; margin-top: 2px; max-width: 170px; }
  #panel .who .bestie { font-size: 11px; opacity: 0.6; margin-top: 2px; }
  #panel .needs { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
  .need { display: flex; align-items: center; gap: 8px; }
  .need label { font-size: 11px; width: 52px; opacity: 0.8; text-align: right; }
  .need .bar { flex: 1; height: 9px; border-radius: 5px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .need .fill { height: 100%; border-radius: 5px; background: var(--accent); transition: width 0.3s; }
  .need .fill.low { background: #f2c84b; }
  .need .fill.crit { background: #ee5d6c; }

  #hint {
    bottom: 14px; left: 14px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 8px 12px;
    font-size: 11.5px; opacity: 0.85; line-height: 1.5; max-width: 240px;
  }

  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .nametag {
    position: absolute; transform: translate(-50%, -100%);
    font-size: 11px; font-weight: 700;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    white-space: nowrap;
  }
  .bubble {
    position: absolute; transform: translate(-50%, -100%);
    background: #fff; color: #1a1d29;
    border-radius: 12px; padding: 7px 11px;
    font-size: 12px; max-width: 200px; line-height: 1.35;
    box-shadow: 0 3px 14px rgba(0,0,0,0.35);
    animation: pop 0.15s ease;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -6px;
    transform: translateX(-50%);
    border: 7px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  @keyframes pop { from { transform: translate(-50%, -90%) scale(0.7); opacity: 0; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="labels"></div>

<div id="clock" class="hud">
  <div>
    <div class="time">8:00 AM</div>
    <div class="day">Day 1</div>
  </div>
  <button data-speed="0">⏸</button>
  <button data-speed="1" class="active">▶</button>
  <button data-speed="3">▶▶</button>
</div>

<div id="roster" class="hud"></div>

<div id="panel" class="hud">
  <div class="portrait"></div>
  <div class="who">
    <div class="name"></div>
    <div class="mbti"></div>
    <div class="doing"></div>
    <div class="bestie"></div>
  </div>
  <div class="needs">
    <div class="need"><label>Hunger</label><div class="bar"><div class="fill" data-need="hunger"></div></div></div>
    <div class="need"><label>Energy</label><div class="bar"><div class="fill" data-need="energy"></div></div></div>
    <div class="need"><label>Fun</label><div class="bar"><div class="fill" data-need="fun"></div></div></div>
    <div class="need"><label>Social</label><div class="bar"><div class="fill" data-need="social"></div></div></div>
  </div>
</div>

<div id="hint" class="hud">
  <b>Click a friend</b> to select them · <b>click the ground</b> to send them walking · <b>click furniture</b> to make them use it · drag to orbit, scroll to zoom
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
