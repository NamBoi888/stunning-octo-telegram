[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "riyadh-transit-scope"
version = "0.1.0"
description = "GTFS network analytics, multi-city transit benchmarking, heat-stress walkability modelling and SVG map rendering for urban transit research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["gtfs", "transit", "gis", "riyadh", "walkability", "urban-heat", "svg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.1",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
transit = "transit_scope.cli:app"
riyadh-transit-scope = "transit_scope.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["transit_scope"]

[tool.hatch.build.targets.sdist]
include = ["transit_scope", "tests", "docs", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
